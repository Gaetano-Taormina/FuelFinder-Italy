<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelFinder Italia - Prezzi Reali</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-slate-100 flex flex-col h-screen overflow-hidden">

    <div id="loader" class="flex">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-600 mb-4"></div>
        <h2 class="text-xl font-bold text-slate-800">Caricamento dei dati ministeriali in corso...</h2>
        <p class="text-slate-500 mt-2">Questa operazione puÃ² richiedere qualche secondo per processare tutti i
            distributori d'Italia.</p>
    </div>

    <div class="bg-white shadow-md p-4 z-20 relative">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-2xl font-extrabold text-slate-800 mb-4 flex items-center gap-2">
                â›½ FuelFinder <span class="text-sm font-normal text-slate-500 hidden sm:inline">| Dati Reali
                    Ministeriali</span>
            </h1>

            <div class="grid grid-cols-1 md:grid-cols-6 gap-4 items-end">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-600 mb-1">CAP / CittÃ </label>
                    <input type="text" id="locationInput" placeholder="Es. 00100 o Roma"
                        class="w-full px-3 py-2 border border-slate-300 rounded-md">
                </div>

                <div class="md:col-span-1 flex gap-2">
                    <button id="searchBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md">Cerca</button>
                    <button id="gpsBtn" title="Usa GPS"
                        class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 px-4 rounded-md">ðŸ“</button>
                </div>

                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Distanza GPS</label>
                    <select id="radiusInput" class="w-full px-3 py-2 border border-slate-300 rounded-md">
                        <option value="3">3 km</option>
                        <option value="5" selected>5 km</option>
                        <option value="10">10 km</option>
                        <option value="20">20 km</option>
                    </select>
                </div>

                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Carburante</label>
                    <select id="fuelTypeInput" class="w-full px-3 py-2 border border-slate-300 rounded-md">
                        <option value="Benzina">Benzina</option>
                        <option value="Gasolio">Gasolio</option>
                        <option value="GPL">GPL</option>
                        <option value="Metano">Metano</option>
                    </select>
                </div>

                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Servizio</label>
                    <select id="serviceTypeInput" class="w-full px-3 py-2 border border-slate-300 rounded-md">
                        <option value="1" selected>Self Service</option>
                        <option value="0">Servito</option>
                        <option value="entrambi">Entrambi</option>
                    </select>
                </div>
            </div>

            <div class="mt-3 flex justify-between items-center">
                <span id="statusText" class="text-sm font-medium text-slate-600">I dati sono pronti. Inserisci un CAP o usa il GPS.</span>
            </div>
        </div>
    </div>

    <div id="map" class="flex-grow w-full"></div>

    <script src="assets/js/script.js"></script>
</body>

</html>
