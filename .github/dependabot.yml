version: 2
updates:
  # Dipendenze JavaScript/Node.js gestite con pnpm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
      vite-and-build:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "cross-env"
      tailwind-ecosystem:
        patterns:
          - "tailwind*"
          - "@tailwindcss/*"
      testing-tools:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/*"
          - "supertest"
          - "happy-dom"
      maps-ecosystem:
        patterns:
          - "leaflet*"
          - "react-leaflet*"
      i18n-ecosystem:
        patterns:
          - "i18next*"
          - "react-i18next*"
      # Raggruppa tutti gli aggiornamenti minori o patch per evitare troppe PR
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Aggiornamento automatico delle GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
