version: 2
updates:
  # Aggiornamenti per le dipendenze pnpm (l'ecosistema è "npm" ma Dependabot rileva pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
      # Raggruppa tutti gli aggiornamenti minori o patch per ridurre il rumore delle PR
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Aggiunto ecosistema per aggiornare automaticamente le GitHub Actions (es. checkout, setup-node)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
