name: Daily Database Build & Release

on:
  schedule:
    # Runs at 07:23 UTC (09:23 CEST Summer) right after MIMIT publishes 09:00 data
    - cron: '23 7 * * *'
    # Runs at 08:23 UTC (09:23 CET Winter)
    - cron: '23 8 * * *'
    # Afternoon check at 14:23 UTC (16:23 CEST / 15:23 CET)
    - cron: '23 14 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-db, trigger-sync]

concurrency:
  group: sync-and-release-db
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-publish-db:
    name: Build, Attest & Publish Database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch MIMIT Open Data & Build Local SQLite DB
        run: node server/sync-cli.js --local

      - name: Compress SQLite Database (Zstandard & Gzip)
        run: |
          zstd -19 -q -c server/database.sqlite > server/database.sqlite.zst
          gzip -9 -c server/database.sqlite > server/database.sqlite.gz
          echo "Original size: $(du -h server/database.sqlite | cut -f1)"
          echo "Zstandard size: $(du -h server/database.sqlite.zst | cut -f1)"
          echo "Gzipped size:  $(du -h server/database.sqlite.gz | cut -f1)"

      - name: Generate Database Release Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            server/database.sqlite.zst
            server/database.sqlite.gz
            server/database.sqlite

      - name: Upload Database to GitHub Release (latest-data)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-data
          name: "Latest MIMIT Fuel Database"
          body: "Automated SQLite snapshot compiled from MIMIT Open Data (Zstandard & Gzip formats)."
          files: |
            server/database.sqlite.zst
            server/database.sqlite.gz
            server/database.sqlite
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
