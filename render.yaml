services:
  # --- 1. BACKEND HEADLESS (Docker Web Service - Free Tier) ---
  - type: web
    name: fuelfinder-backend
    runtime: docker
    region: frankfurt
    plan: free
    branch: publication
    rootDir: server
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false
    buildFilter:
      paths:
        - server/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
      ignoredPaths:
        - client/**
        - tests/frontend/**
        - .agents/**
        - "*.md"
        - .vscode/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: "*"
      - key: DB_DOWNLOAD_URL
        value: https://github.com/Gaetano-Taormina/FuelFinder-Italy/releases/download/latest-data/database.sqlite.gz

  # --- 2. FRONTEND CLIENT (Static Site - Free Tier 0ms Always On) ---
  - type: web
    name: fuelfinder-italia
    runtime: static
    branch: publication
    rootDir: client
    buildCommand: pnpm install && pnpm build
    staticPublishPath: dist
    autoDeploy: false
    buildFilter:
      paths:
        - client/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
      ignoredPaths:
        - server/**
        - tests/backend/**
        - .agents/**
        - "*.md"
        - .vscode/**
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: fuelfinder-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
