<body>
    <style>
        body { margin: 0; background-color: #f8fafc; }
        @media (prefers-color-scheme: dark) { body { background-color: #0f172a; } }
        .initial-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: system-ui, -apple-system, sans-serif; }
        .spinner { width: 48px; height: 48px; border: 4px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
        @media (prefers-color-scheme: dark) { .spinner { border-color: #334155; border-top-color: #3b82f6; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 16px; color: #475569; font-size: 1.125rem; font-weight: 500; }
        @media (prefers-color-scheme: dark) { .loading-text { color: #94a3b8; } }
    </style>
    <div id="root">
        <div class="initial-loader" role="status" aria-label="Caricamento in corso">
            <div class="spinner" aria-hidden="true"></div>
            <div class="loading-text"><span class="tracking-tight drop-shadow-sm">FuelFinder</span></div>
        </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>
